version: "3.9"

# Phase 2 -- three independent services + a gateway, each built and deployed
# separately. Run with: docker-compose up --build (from this directory).
# Only the gateway is exposed to the host; the other three are reachable
# only from inside this compose network, by service name.

services:
  user-service:
    build: ./user-service
    volumes:
      - ./user-service:/app
    environment:
      - GLOBETROTTER_SECRET=dev-secret-change-me

  itinerary-service:
    build: ./itinerary-service
    volumes:
      - ./itinerary-service:/app
    environment:
      - GLOBETROTTER_SECRET=dev-secret-change-me
      - USER_SERVICE_URL=http://user-service:5001
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5003
    depends_on:
      - user-service
      - recommendation-service

  recommendation-service:
    build: ./recommendation-service
    volumes:
      - ./recommendation-service:/app
    environment:
      - GLOBETROTTER_SECRET=dev-secret-change-me
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
      # Powers the "ask a question" AI feature; feature degrades to a
      # templated answer if left unset. Get a real key from
      # console.anthropic.com -- never hardcode one here.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - user-service

  gateway:
    build: ./gateway
    container_name: globetrotter_gateway
    ports:
      - "5000:5000"
    environment:
      - USER_SERVICE_URL=http://user-service:5001
      - ITINERARY_SERVICE_URL=http://itinerary-service:5002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5003
    depends_on:
      - user-service
      - itinerary-service
      - recommendation-service
