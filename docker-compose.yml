version: "3.9"

services:
  globetrotter:
    build: .
    container_name: globetrotter_app
    ports:
      - "5000:5000"
    # Mount the backend source so changes are reflected without rebuilding the image.
    volumes:
      - ./backend:/app
    environment:
      - GLOBETROTTER_SECRET=dev-secret-change-me
