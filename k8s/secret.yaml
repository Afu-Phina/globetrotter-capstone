apiVersion: v1
kind: Secret
metadata:
  name: globetrotter-secret
  labels:
    app: globetrotter-backend
type: Opaque
stringData:
  # Overrides the SECRET_KEY fallback in backend/app/utils/auth.py.
  # Replace before anything but local experimentation.
  GLOBETROTTER_SECRET: dev-secret-change-me
  # Powers the "ask a question" AI feature (backend/app/utils/ai.py).
  # Replace with a real key from console.anthropic.com -- the feature
  # degrades to a templated answer if this is left as a placeholder.
  ANTHROPIC_API_KEY: replace-with-a-real-anthropic-api-key
